name: PC installer
# Windows 설치 파일 만들기: 이 저장소의 최신 앱 파일(DeskCal-app-<버전>.zip)로 설치 파일을 만들고, 실행 시험 뒤 릴리스에 올림
on:
  workflow_dispatch:
    inputs:
      electron:
        description: Electron version
        default: "45.3.3"
      publish:
        description: Publish release (yes/no)
        default: "yes"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Unpack app
        shell: bash
        run: |
          V=$(node -p "require('./latest.json').version")
          echo "APPV=$V" >> $GITHUB_ENV
          mkdir -p build/app && cd build/app && unzip -q ../../DeskCal-app-$V.zip
          npm install --omit=dev --no-audit --no-fund
          # 다른 운영체제용 부품은 빼서 설치 파일을 가볍게
          if [ -d node_modules/koffi/build/koffi ]; then find node_modules/koffi/build/koffi -mindepth 1 -maxdepth 1 ! -name 'win32_x64' -exec rm -rf {} +; fi
          rm -rf node_modules/koffi/src node_modules/koffi/vendor node_modules/koffi/doc 2>/dev/null || true
          du -sh node_modules | tail -1
      - name: Build installer
        shell: bash
        run: |
          cd build
          cat > builder.json <<JSON
          {
            "appId": "com.deskcal.app",
            "productName": "Total Calendar",
            "executableName": "TotalCalendar",
            "electronVersion": "${{ inputs.electron }}",
            "asar": false,
            "compression": "maximum",
            "electronLanguages": ["ko", "en-US", "ja", "zh-CN", "es"],
            "npmRebuild": false,
            "directories": { "app": "app", "output": "out" },
            "win": { "target": [{ "target": "nsis", "arch": ["x64"] }], "icon": "app/assets/icon.ico", "artifactName": "TotalCalendar-Setup.exe" },
            "nsis": { "oneClick": true, "perMachine": false, "createDesktopShortcut": true, "createStartMenuShortcut": true, "shortcutName": "Total Calendar", "runAfterFinish": true, "differentialPackage": false, "deleteAppDataOnUninstall": false },
            "publish": null
          }
          JSON
          npx --yes electron-builder@26 --win --x64 --config builder.json
          ls -la out
      - name: Smoke test
        shell: bash
        run: node tools/smoke.mjs "build/out/win-unpacked/TotalCalendar.exe"
      - name: Save smoke screenshots
        if: always()
        shell: bash
        run: |
          mkdir -p shots && cp smoke-*.png shots/ 2>/dev/null || true
          cd shots && git init -q -b smoke && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "smoke screenshots" || true
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" smoke || true
      - name: Publish release
        if: inputs.publish == 'yes'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/out
          SHA=$(sha256sum TotalCalendar-Setup.exe | cut -d' ' -f1)
          gh release delete "pc-v$APPV" --yes --cleanup-tag 2>/dev/null || true
          gh release create "pc-v$APPV" TotalCalendar-Setup.exe --title "Total Calendar $APPV (Windows)" --notes "Windows 10·11 (64비트) 설치 파일입니다. 설치 후에는 앱 안에서 자동으로 업데이트됩니다.

          SHA-256: $SHA" --latest
